name: Terraform

on:
  pull_request:
    branches:
      - main
    paths:
      - "environments/preprod/**"
      - "modules/**"

  push:
    branches:
      - main
    paths:
      - "environments/preprod/**"
      - "modules/**"

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/preprod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan