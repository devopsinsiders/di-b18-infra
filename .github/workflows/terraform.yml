name: Terraform

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/preprod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
          --clientId "df8d4562-fbbb-460f-aeb4-6c2a3e20f93d"\
          --tenantId "68b57cef-8853-40ba-a5bf-74d983ad860c"\
          --clientSecret "dw68Q~MhGwzWoi~tj.dIOKwArKEAXuk7UXP4taCQ"\
          --subscriptionId "c1b1d9d6-201f-4fc0-be46-2641cd9838df"
      
      - name: Check Azure Login
        run: az account show

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    # Apply ONLY after push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: environments/preprod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
          --clientId "df8d4562-fbbb-460f-aeb4-6c2a3e20f93d"\
          --tenantId "68b57cef-8853-40ba-a5bf-74d983ad860c"\
          --clientSecret "dw68Q~MhGwzWoi~tj.dIOKwArKEAXuk7UXP4taCQ"\
          --subscriptionId "c1b1d9d6-201f-4fc0-be46-2641cd9838df"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "bc9d2c5e-f99f-4142-8f22-8f6dae37180d"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
